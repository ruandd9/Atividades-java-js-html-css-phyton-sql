<!DOCTYPE html>
<html>
	<head>
		<title>Minecraft Clicker - Victory</title>
		<meta charset="UTF-8" />

		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

		<link rel="stylesheet" href="estilo.css" />
	</head>
	<body class="forest day">

		<div class="container">
			<div class="row mt-5">
				<div class="col">
					<div class="d-flex justify-content-center">
						<div class="card bg-dark text-white" style="max-width: 600px; opacity: 0.9;">
							<div class="card-body text-center">
								<h1 class="card-title" style="color: #5cb85c; font-weight: bold;">VICTORY!</h1>
								<p class="card-text mt-4" style="font-size: 18px;">
									You've survived and collected enough resources to thrive in the Minecraft world!
								</p>
								<p class="card-text" style="font-size: 16px;">
									Final Score: <span id="final-score">0</span>
								</p>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="row mt-4">
				<div class="col">
					<div class="d-flex justify-content-center">
						<button type="button" class="btn btn-success btn-lg" onclick="window.location.href = 'index.html'">Play Again</button>
					</div>
				</div>
			</div>
		</div>

		<script>
			// Get score from localStorage if available
			document.getElementById('final-score').innerText = localStorage.getItem('minecraft_score') || '0';
		</script>
	</body>
</html>
